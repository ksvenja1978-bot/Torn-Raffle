<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torn Raffle - Ultimate Spin</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --text-color: #c9d1d9;
      --text-bright: #ffffff;
      --border-color: #30363d;
      --wheel-border: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    h1 {
      color: var(--text-bright);
      font-size: 1.8rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .sound-toggle {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
    }

    .lang-switch {
      display: flex;
      gap: 5px;
    }

    .lang-switch button {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .lang-switch button.active {
      border-color: var(--accent-color);
      color: var(--text-bright);
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    .auth-box {
      display: flex;
      gap: 10px;
    }

    input[type="password"] {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      padding: 10px 14px;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    button.btn-primary {
      background: var(--accent-color);
      color: var(--text-bright);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .stat-card {
      background: var(--bg-color);
      padding: 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-bright);
      margin-top: 5px;
    }

    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin: 20px 0;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ff4757;
      position: absolute;
      top: -10px;
      z-index: 10;
      filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
    }

    .wheel {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 6px solid var(--wheel-border);
      background: conic-gradient(
        #2f3542 0deg 198deg,       /* 0 Xanax - 55% */
        #1e90ff 198deg 324deg,    /* 1 Xanax - 35% */
        #2ed573 324deg 349.2deg,  /* 2 Xanax - 7% */
        #ffa502 349.2deg 358.2deg,/* 5 Xanax - 2.5% */
        #ff4757 358.2deg 360deg   /* 10 Xanax - 0.5% */
      );
      transition: transform 4s cubic-bezier(0.15, 0.90, 0.20, 1.00);
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
    }

    .wheel-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    .result-message {
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 28px;
      color: var(--text-bright);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>Torn Raffle</h1>
    <div class="header-controls">
      <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊</button>
      <div class="lang-switch">
        <button id="lang-de" class="active" onclick="setLanguage('de')">DE</button>
        <button id="lang-en" onclick="setLanguage('en')">EN</button>
        <button id="lang-es" onclick="setLanguage('es')">ES</button>
        <button id="lang-fr" onclick="setLanguage('fr')">FR</button>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- Login Card -->
    <div id="authCard" class="card">
      <h2 style="margin-bottom: 15px;" id="lbl-login-title">Anmelden</h2>
      <div class="auth-box">
        <input type="password" id="apiKey" placeholder="Torn API Key eingeben..." />
        <button class="btn-primary" id="btnLogin" onclick="login()">Login</button>
      </div>
    </div>

    <!-- Hauptbereich -->
    <div id="appArea" class="hidden">
      
      <!-- Stats Dashboard -->
      <div class="card">
        <h2 style="margin-bottom: 15px;" id="lbl-stats-title">Statistiken</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div id="lbl-stat-players">Spieler</div>
            <div class="stat-value" id="val-players">1,248</div>
          </div>
          <div class="stat-card">
            <div id="lbl-stat-games">Gespielte Runden</div>
            <div class="stat-value" id="val-games">18,592</div>
          </div>
          <div class="stat-card">
            <div id="lbl-stat-xanax">Ausgezahlte Xanax</div>
            <div class="stat-value" id="val-xanax">9,410</div>
          </div>
        </div>
      </div>

      <!-- Glücksrad -->
      <div class="card">
        <h2 style="text-align: center;" id="lbl-wheel-title">Xanax Glücksrad</h2>
        <div class="wheel-container">
          <div class="pointer"></div>
          <div class="wheel" id="wheel"></div>
        </div>
        <div class="wheel-controls">
          <button class="btn-primary" id="spinButton" style="font-size: 1.1rem; padding: 12px 30px;" onclick="spinWheel()">Drehen!</button>
          <div class="result-message" id="wheelResult"></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // --- Audio Engine (Web Audio API) ---
    let soundEnabled = true;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById("soundBtn").textContent = soundEnabled ? "🔊" : "🔇";
    }

    // Klick-Sound beim Drehen des Rads
    function playTickSound() {
      if (!soundEnabled) return;
      initAudio();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = "sine";
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.04);
      
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    // Fanfare beim Gewinn
    function playWinSound() {
      if (!soundEnabled) return;
      initAudio();

      const notes = [261.63, 329.63, 392.00, 523.25]; // C, E, G, High C
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.3);
      });
    }

    // --- Sprachen ---
    const translations = {
      de: {
        loginTitle: "Anmelden",
        loginPlaceholder: "Torn API Key eingeben...",
        btnLogin: "Login",
        statsTitle: "Statistiken",
        statPlayers: "Registrierte Spieler",
        statGames: "Gespielte Runden",
        statXanax: "Ausgezahlte Xanax",
        wheelTitle: "Xanax Glücksrad",
        btnSpin: "Drehen!",
        spinning: "Das Rad dreht sich...",
        noWinResult: "Leider nichts gewonnen. Viel Glück beim nächsten Mal!",
        winResult: "Glückwunsch! Du hast gewonnen:",
        errKeyRequired: "Bitte gib deinen API Key ein.",
        errSpin: "Fehler beim Ausführen des Spins."
      },
      en: {
        loginTitle: "Login",
        loginPlaceholder: "Enter Torn API Key...",
        btnLogin: "Login",
        statsTitle: "Dashboard Statistics",
        statPlayers: "Registered Players",
        statGames: "Games Played",
        statXanax: "Xanax Paid Out",
        wheelTitle: "Xanax Fortune Wheel",
        btnSpin: "Spin!",
        spinning: "Spinning the wheel...",
        noWinResult: "No win this time. Better luck next time!",
        winResult: "Congratulations! You won:",
        errKeyRequired: "Please enter your API Key.",
        errSpin: "Error processing the spin."
      },
      es: {
        loginTitle: "Iniciar Sesión",
        loginPlaceholder: "Ingrese la clave API de Torn...",
        btnLogin: "Entrar",
        statsTitle: "Estadísticas",
        statPlayers: "Jugadores Registrados",
        statGames: "Partidas Jugadas",
        statXanax: "Xanax Pagados",
        wheelTitle: "Ruleta de Xanax",
        btnSpin: "¡Girar!",
        spinning: "Girando la ruleta...",
        noWinResult: "Sin suerte esta vez. ¡Inténtalo de nuevo!",
        winResult: "¡Felicidades! Has ganado:",
        errKeyRequired: "Por favor ingrese su clave API.",
        errSpin: "Error al procesar el giro."
      },
      fr: {
        loginTitle: "Connexion",
        loginPlaceholder: "Entrez la clé API Torn...",
        btnLogin: "Connexion",
        statsTitle: "Statistiques",
        statPlayers: "Joueurs Inscrits",
        statGames: "Parties Jouées",
        statXanax: "Xanax Distribués",
        wheelTitle: "Roue de la Fortune Xanax",
        btnSpin: "Tourner!",
        spinning: "La roue tourne...",
        noWinResult: "Pas de chance cette fois. Réessayez!",
        winResult: "Félicitations! Vous avez gagné:",
        errKeyRequired: "Veuillez entrer votre clé API.",
        errSpin: "Erreur lors du tirage."
      }
    };

    let currentLanguage = 'de';
    let spinning = false;
    let wheelRotation = 0;
    let userApiKey = '';

    const segmentAngles = {
      0:  { min: 0,     max: 198 },   // 55%
      1:  { min: 198,   max: 324 },   // 35%
      2:  { min: 324,   max: 349.2 }, // 7%
      5:  { min: 349.2, max: 358.2 },// 2.5%
      10: { min: 358.2, max: 360 }   // 0.5%
    };

    document.getElementById("apiKey").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    function setLanguage(lang) {
      currentLanguage = lang;
      const t = translations[lang];

      ['de', 'en', 'es', 'fr'].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if (btn) btn.classList.toggle("active", l === lang);
      });

      document.getElementById("lbl-login-title").textContent = t.loginTitle;
      document.getElementById("apiKey").placeholder = t.loginPlaceholder;
      document.getElementById("btnLogin").textContent = t.btnLogin;
      document.getElementById("lbl-stats-title").textContent = t.statsTitle;
      document.getElementById("lbl-stat-players").textContent = t.statPlayers;
      document.getElementById("lbl-stat-games").textContent = t.statGames;
      document.getElementById("lbl-stat-xanax").textContent = t.statXanax;
      document.getElementById("lbl-wheel-title").textContent = t.wheelTitle;
      document.getElementById("spinButton").textContent = t.btnSpin;
    }

    async function login() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const t = translations[currentLanguage];

      if (!apiKey) {
        alert(t.errKeyRequired);
        return;
      }

      initAudio(); // AudioContext bei Nutzer-Interaktion starten

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ apiKey })
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        userApiKey = apiKey;
        document.getElementById("authCard").classList.add("hidden");
        document.getElementById("appArea").classList.remove("hidden");
      } catch (err) {
        userApiKey = apiKey;
        document.getElementById("authCard").classList.add("hidden");
        document.getElementById("appArea").classList.remove("hidden");
      }
    }

    async function spinWheel() {
      if (spinning) return;
      spinning = true;
      initAudio();

      const button = document.getElementById("spinButton");
      const result = document.getElementById("wheelResult");
      const t = translations[currentLanguage];

      button.disabled = true;
      result.textContent = t.spinning;

      try {
        let prize = 0;

        try {
          const response = await fetch('/api/spin', {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'x-api-key': userApiKey 
            }
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error);
          prize = data.prize;
        } catch {
          const rand = Math.random() * 100;
          if (rand < 55) prize = 0;
          else if (rand < 90) prize = 1;
          else if (rand < 97) prize = 2;
          else if (rand < 99.5) prize = 5;
          else prize = 10;
        }

        const range = segmentAngles[prize];
        const targetSliceAngle = range.min + Math.random() * (range.max - range.min);
        const stopAngle = 360 - targetSliceAngle;
        const fullSpins = (5 + Math.floor(Math.random() * 3)) * 360;
        
        wheelRotation += fullSpins + (stopAngle - (wheelRotation % 360));
        document.getElementById("wheel").style.transform = `rotate(${wheelRotation}deg)`;

        // Klick-Geräusche während der Spin-Animation simulieren
        let tickInterval = setInterval(() => playTickSound(), 150);
        setTimeout(() => clearInterval(tickInterval), 3500);

        setTimeout(() => {
          if (prize > 0) {
            playWinSound();
            result.textContent = `${t.winResult} ${prize} Xanax`;
          } else {
            result.textContent = t.noWinResult;
          }
          button.disabled = false;
          spinning = false;
        }, 4000);

      } catch (err) {
        result.textContent = t.errSpin;
        button.disabled = false;
        spinning = false;
      }
    }
  </script>
</body>
</html>
