<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torn Raffle - Ultimate Spin</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --text-color: #c9d1d9;
      --text-bright: #ffffff;
      --border-color: #30363d;
      --wheel-border: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 30px;
    }

    h1 {
      color: var(--text-bright);
      font-size: 1.8rem;
    }

    .lang-switch button {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 5px;
    }

    .lang-switch button.active {
      border-color: var(--accent-color);
      color: var(--text-bright);
      font-weight: bold;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
    }

    /* Auth Section */
    .auth-box {
      display: flex;
      gap: 10px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-bright);
      padding: 10px 14px;
      border-radius: 6px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent-color);
    }

    button.btn-primary {
      background: var(--accent-color);
      color: var(--text-bright);
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Dashboard Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .stat-card {
      background: var(--bg-color);
      padding: 15px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--text-bright);
      margin-top: 5px;
    }

    /* Wheel Section */
    .wheel-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin: 20px 0;
    }

    .pointer {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 25px solid #ff4757;
      position: absolute;
      top: -10px;
      z-index: 10;
    }

    .wheel {
      width: 300px;
      height: 300px;
      border-radius: 50%;
      border: 5px solid var(--wheel-border);
      /* Visualisierung der Wahrscheinlichkeiten: 0 (55%), 1 (35%), 2 (7%), 5 (2.5%), 10 (0.5%) */
      background: conic-gradient(
        #2f3542 0deg 198deg,     /* 0 Xanax - 55% */
        #1e90ff 198deg 324deg,  /* 1 Xanax - 35% */
        #2ed573 324deg 349.2deg, /* 2 Xanax - 7% */
        #ffa502 349.2deg 358.2deg, /* 5 Xanax - 2.5% */
        #ff4757 358.2deg 360deg /* 10 Xanax - 0.5% */
      );
      transition: transform 4s cubic-bezier(0.15, 0.90, 0.20, 1.00);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    .wheel-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
    }

    .result-message {
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 28px;
      color: var(--text-bright);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>Torn Raffle</h1>
    <div class="lang-switch">
      <button id="lang-de" class="active" onclick="setLanguage('de')">DE</button>
      <button id="lang-en" onclick="setLanguage('en')">EN</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Login Card -->
    <div id="authCard" class="card">
      <h2 style="margin-bottom: 15px;" id="lbl-login-title">Anmelden</h2>
      <div class="auth-box">
        <input type="password" id="apiKey" placeholder="Torn API Key eingeben..." />
        <button class="btn-primary" id="btnLogin" onclick="login()">Login</button>
      </div>
    </div>

    <!-- App Area (nach Login sichtbar) -->
    <div id="appArea" class="hidden">
      
      <!-- Stats Dashboard -->
      <div class="card">
        <h2 style="margin-bottom: 15px;" id="lbl-stats-title">Statistiken</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <div id="lbl-stat-players">Spieler</div>
            <div class="stat-value" id="val-players">1,248</div>
          </div>
          <div class="stat-card">
            <div id="lbl-stat-games">Gespielte Runden</div>
            <div class="stat-value" id="val-games">18,592</div>
          </div>
          <div class="stat-card">
            <div id="lbl-stat-xanax">Ausgezahlte Xanax</div>
            <div class="stat-value" id="val-xanax">9,410</div>
          </div>
        </div>
      </div>

      <!-- Glücksrad -->
      <div class="card">
        <h2 style="text-align: center;" id="lbl-wheel-title">Xanax Glücksrad</h2>
        <div class="wheel-container">
          <div class="pointer"></div>
          <div class="wheel" id="wheel"></div>
        </div>
        <div class="wheel-controls">
          <button class="btn-primary" id="spinButton" style="font-size: 1.1rem; padding: 12px 30px;" onclick="spinWheel()">Drehen!</button>
          <div class="result-message" id="wheelResult"></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // --- Mehrsprachigkeit ---
    const translations = {
      de: {
        loginTitle: "Anmelden",
        loginPlaceholder: "Torn API Key eingeben...",
        btnLogin: "Login",
        statsTitle: "Statistiken",
        statPlayers: "Registrierte Spieler",
        statGames: "Gespielte Runden",
        statXanax: "Ausgezahlte Xanax",
        wheelTitle: "Xanax Glücksrad",
        btnSpin: "Drehen!",
        spinning: "Das Rad dreht sich...",
        noWinResult: "Leider nichts gewonnen. Viel Glück beim nächsten Mal!",
        winResult: "Glückwunsch! Du hast gewonnen:",
        errKeyRequired: "Bitte gib deinen API Key ein.",
        errSpin: "Fehler beim Ausführen des Spins."
      },
      en: {
        loginTitle: "Login",
        loginPlaceholder: "Enter Torn API Key...",
        btnLogin: "Login",
        statsTitle: "Dashboard Statistics",
        statPlayers: "Registered Players",
        statGames: "Games Played",
        statXanax: "Xanax Paid Out",
        wheelTitle: "Xanax Fortune Wheel",
        btnSpin: "Spin!",
        spinning: "Spinning the wheel...",
        noWinResult: "No win this time. Better luck next time!",
        winResult: "Congratulations! You won:",
        errKeyRequired: "Please enter your API Key.",
        errSpin: "Error processing the spin."
      }
    };

    let currentLanguage = 'de';
    let spinning = false;
    let wheelRotation = 0;

    // --- Exakte Winkelbereichs-Zuordnung passend zu conic-gradient ---
    const segmentAngles = {
      0:  { min: 0,     max: 198 },   // 55%  (0 Xanax)
      1:  { min: 198,   max: 324 },   // 35%  (1 Xanax)
      2:  { min: 324,   max: 349.2 }, // 7%   (2 Xanax)
      5:  { min: 349.2, max: 358.2 },// 2.5% (5 Xanax)
      10: { min: 358.2, max: 360 }   // 0.5% (10 Xanax)
    };

    // --- Tastatur-EventListener (Enter-Taste für Login) ---
    document.getElementById("apiKey").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    // --- Sprach-Wechsler ---
    function setLanguage(lang) {
      currentLanguage = lang;
      const t = translations[lang];

      document.getElementById("lang-de").classList.toggle("active", lang === 'de');
      document.getElementById("lang-en").classList.toggle("active", lang === 'en');

      document.getElementById("lbl-login-title").textContent = t.loginTitle;
      document.getElementById("apiKey").placeholder = t.loginPlaceholder;
      document.getElementById("btnLogin").textContent = t.btnLogin;
      document.getElementById("lbl-stats-title").textContent = t.statsTitle;
      document.getElementById("lbl-stat-players").textContent = t.statPlayers;
      document.getElementById("lbl-stat-games").textContent = t.statGames;
      document.getElementById("lbl-stat-xanax").textContent = t.statXanax;
      document.getElementById("lbl-wheel-title").textContent = t.wheelTitle;
      document.getElementById("spinButton").textContent = t.btnSpin;
    }

    // --- Login Logik ---
    function login() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const t = translations[currentLanguage];

      if (!apiKey) {
        alert(t.errKeyRequired);
        return;
      }

      // Erfolgreichen Login simulieren/ausführen
      document.getElementById("authCard").classList.add("hidden");
      document.getElementById("appArea").classList.remove("hidden");
    }

    // --- Sichere Spin-Berechnung ---
    async function spinWheel() {
      if (spinning) return;
      spinning = true;

      const button = document.getElementById("spinButton");
      const result = document.getElementById("wheelResult");
      const t = translations[currentLanguage];

      button.disabled = true;
      result.textContent = t.spinning;

      try {
        // Mock-API-Aufruf: Ersetze diesen Block später durch deinen echten fetch() Aufruf!
        const data = await mockApiSpinCall();

        // Target-Slice im Winkelbereich ermitteln
        const range = segmentAngles[data.prize];
        const targetSliceAngle = range.min + Math.random() * (range.max - range.min);

        // Drehung so berechnen, dass das Target genau unter dem oberen Zeiger landet
        const stopAngle = 360 - targetSliceAngle;
        const fullSpins = (5 + Math.floor(Math.random() * 3)) * 360;
        
        wheelRotation += fullSpins + (stopAngle - (wheelRotation % 360));
        document.getElementById("wheel").style.transform = `rotate(${wheelRotation}deg)`;

        // Auswertung nach Animationsende
        setTimeout(() => {
          result.textContent = data.prize === 0 
            ? t.noWinResult 
            : `${t.winResult} ${data.prize} Xanax`;
          button.disabled = false;
          spinning = false;
        }, 4000);

      } catch (err) {
        result.textContent = t.errSpin;
        button.disabled = false;
        spinning = false;
      }
    }

    // --- Simulierte Backend-Response (Gewichtsbasierte Zufallsentscheidung) ---
    function mockApiSpinCall() {
      return new Promise((resolve) => {
        setTimeout(() => {
          const rand = Math.random() * 100;
          let prize = 0;

          if (rand < 55) prize = 0;
          else if (rand < 90) prize = 1;
          else if (rand < 97) prize = 2;
          else if (rand < 99.5) prize = 5;
          else prize = 10;

          resolve({ success: true, prize });
        }, 300);
      });
    }
  </script>
</body>
</html>
