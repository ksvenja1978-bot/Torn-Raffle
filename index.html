<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torn Raffle</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
            background: #1c1c1c;
        }

        h1 {
            font-size: 42px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #bbb;
            font-size: 18px;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .box {
            background: #1c1c1c;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        button {
            padding: 14px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #6c3cff;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Torn Raffle</h1>
        <div class="subtitle">Raffles and giveaways for Torn players</div>
    </header>

    <main>

        <div class="box">
            <h2>Willkommen bei Torn Raffle!</h2>
            <p>
                Hier entsteht eine Raffle-Plattform für die Torn-Community.
            </p>
            <button>Login mit Torn</button>
        </div>

        <div class="box">
            <h2>So funktioniert es</h2>
            <p>
                Spieler können sich anmelden und an verschiedenen
                Raffles teilnehmen.
            </p>
        </div>

    </main>

    <footer>
        Torn Raffle – Projekt im Aufbau
    </footer>

</body>
</html>
